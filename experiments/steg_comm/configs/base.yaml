name: steg_comm
function_name: run_steg
time_stamp_name: true
log_file_path: results/RUN_NAME/logs.txt
save_config_path: results/RUN_NAME/config.yaml
function_kwargs:
  model: claude-haiku-4-5-20251001   # called via the Claude Code CLI (your subscription)
  thinking_budget: 4096              # MAX_THINKING_TOKENS per call
  max_concurrency: 8                 # parallel `claude -p` processes
  n_eval: 8
  n_values: 6
  value_range: 3
  seed: 0
